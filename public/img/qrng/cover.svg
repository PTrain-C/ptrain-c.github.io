<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 625" role="img" aria-label="A Magic 8-Ball floating in violet space, its answer window showing YES and the ket |101⟩, with faint orbits around it">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.48" r="0.7">
      <stop offset="0" stop-color="#3a3170"/>
      <stop offset="0.55" stop-color="#221f3d"/>
      <stop offset="1" stop-color="#121024"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5a5868"/>
      <stop offset="0.25" stop-color="#25242e"/>
      <stop offset="0.7" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="win" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1a1f5c"/>
      <stop offset="1" stop-color="#05061a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9abf5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b9abf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6cf0"/>
      <stop offset="1" stop-color="#2f3fbf"/>
    </linearGradient>
  </defs>

  <rect width="800" height="625" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#dcd4fb">
    <circle cx="90" cy="80" r="1.6" opacity="0.6"/><circle cx="170" cy="190" r="1.2" opacity="0.4"/><circle cx="60" cy="330" r="1.8" opacity="0.5"/>
    <circle cx="130" cy="520" r="1.3" opacity="0.5"/><circle cx="250" cy="60" r="1.1" opacity="0.4"/><circle cx="700" cy="70" r="1.7" opacity="0.6"/>
    <circle cx="640" cy="170" r="1.2" opacity="0.4"/><circle cx="745" cy="300" r="1.5" opacity="0.5"/><circle cx="690" cy="540" r="1.8" opacity="0.6"/>
    <circle cx="560" cy="590" r="1.1" opacity="0.4"/><circle cx="320" cy="585" r="1.4" opacity="0.4"/><circle cx="540" cy="40" r="1.3" opacity="0.5"/>
  </g>

  <!-- halo -->
  <circle cx="400" cy="312" r="300" fill="url(#glow)"/>

  <!-- orbits, back halves -->
  <g fill="none" stroke="#b9abf5" stroke-width="2">
    <ellipse cx="400" cy="312" rx="335" ry="135" transform="rotate(-18 400 312)" stroke-opacity="0.35"/>
    <ellipse cx="400" cy="312" rx="300" ry="70" transform="rotate(22 400 312)" stroke-opacity="0.22" stroke-dasharray="5 9"/>
  </g>

  <!-- ball -->
  <circle cx="400" cy="312" r="200" fill="url(#ball)"/>
  <ellipse cx="335" cy="215" rx="78" ry="44" transform="rotate(-32 335 215)" fill="#ffffff" fill-opacity="0.14"/>
  <ellipse cx="318" cy="200" rx="26" ry="13" transform="rotate(-32 318 200)" fill="#ffffff" fill-opacity="0.35"/>

  <!-- answer window -->
  <circle cx="412" cy="326" r="96" fill="#0c0c12" stroke="#2c2b36" stroke-width="6"/>
  <circle cx="412" cy="326" r="86" fill="url(#win)"/>
  <path d="M412 262 L477 372 L347 372 Z" fill="url(#tri)" stroke="#8d9bff" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round"/>
  <text x="412" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="2" fill="#f2f0ff">YES</text>
  <text x="412" y="360" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#f2f0ff" fill-opacity="0.75">|101⟩</text>

  <!-- orbits, front arcs and particles -->
  <path d="M65 312 A335 135 0 0 0 735 312" transform="rotate(-18 400 312)" fill="none" stroke="#b9abf5" stroke-opacity="0.6" stroke-width="2.5"/>
  <circle cx="145" cy="466" r="16" fill="#b9abf5" fill-opacity="0.25"/>
  <circle cx="145" cy="466" r="7" fill="#dcd4fb"/>
  <circle cx="706" cy="272" r="6" fill="#dcd4fb" fill-opacity="0.85"/>
  <circle cx="150" cy="170" r="4" fill="#b9abf5" fill-opacity="0.6"/>

  <!-- kets drifting -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" fill="#dcd4fb">
    <text x="96" y="268" font-size="20" fill-opacity="0.35">|0⟩</text>
    <text x="664" y="372" font-size="20" fill-opacity="0.35">|1⟩</text>
    <text x="600" y="120" font-size="16" fill-opacity="0.25">H</text>
    <text x="210" y="560" font-size="16" fill-opacity="0.25">H</text>
  </g>
</svg>
